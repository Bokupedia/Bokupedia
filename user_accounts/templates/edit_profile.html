{% extends 'layout.html' %}
{% block content %}

<div class="edit-profile-wrap">
  <form method="post" enctype="multipart/form-data" class="edit-form">
    {% csrf_token %}

    <div class="form-header">
      <h2>Profili Düzenle</h2>
      <p>Bilgilerini güncelle</p>
    </div>

    <div class="form-group">
      <label for="id_first_name">Ad</label>
      {{ form.first_name }}
    </div>

    <div class="form-group bio-group">
      <label for="id_bio">Biyografi</label>
      {{ form.bio }}
      <div class="bio-counter"><span id="current">0</span> / 500</div>
    </div>

    <button type="submit" class="save-btn">Kaydet</button>
  </form>
</div>

<style>
.edit-profile-wrap {
  display: flex;
  justify-content: center;
  padding: 32px 1em 60px;
}

.edit-form {
  background-color: rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 32px 36px;
  width: 100%;
  max-width: 520px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  gap: 20px;
  animation: fadeIn 0.4s ease-out forwards;
}

.form-header { margin-bottom: 4px; }

.form-header h2 {
  color: #fff;
  font-size: 1.7em;
  font-weight: 800;
  margin: 0 0 4px;
}

.form-header p {
  color: #555;
  font-size: 0.88em;
  margin: 0;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
}

.edit-form label {
  color: #aaa;
  font-size: 0.82em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.edit-form input[type="text"],
.edit-form input[type="email"],
.edit-form input[type="file"],
.edit-form textarea,
.edit-form select {
  width: 100%;
  background-color: #1a1a1a;
  color: #e0e0e0;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.95em;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-sizing: border-box;
}

.edit-form input:focus,
.edit-form textarea:focus {
  outline: none;
  border-color: #cc1111;
  box-shadow: 0 0 0 3px rgba(204,17,17,0.12);
  background-color: #1e1e1e;
}

.edit-form input::placeholder,
.edit-form textarea::placeholder {
  color: #555;
}

.bio-group textarea {
  min-height: 180px;
  resize: vertical;
  line-height: 1.6;
}

.bio-counter {
  text-align: right;
  color: #444;
  font-size: 0.78em;
  margin-top: 2px;
}

.bio-counter.near-limit { color: #ff4444; }

.save-btn {
  background-color: #cc1111;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: 0.95em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.2s;
  margin-top: 4px;
}

.save-btn:hover { background-color: #e61414; transform: translateY(-1px); }
.save-btn:active { background-color: #b30f0f; transform: translateY(1px); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 560px) {
  .edit-form { padding: 20px 16px; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const bio = document.querySelector('#id_bio');
  const counter = document.getElementById('current');
  const counterEl = document.querySelector('.bio-counter');

  function update() {
    const len = bio.value.length;
    counter.textContent = len;
    counterEl.classList.toggle('near-limit', len > 450);
  }

  if (bio) { bio.addEventListener('input', update); update(); }
});
</script>
{% endblock %}

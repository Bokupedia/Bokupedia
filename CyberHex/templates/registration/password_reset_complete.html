{% extends 'layout.html' %}
{% block content %}
<div class="edit-profile-container">
    <h2>Şifre Güncellendi ✓</h2>
    <p style="color:#aaa; text-align:center; margin-bottom:1.5em;">
        Şifreniz başarıyla sıfırlandı. Artık giriş yapabilirsiniz.
    </p>
    <a href="{% url 'user_accounts:login' %}" class="save-button" style="display:block; text-align:center; text-decoration:none;">
        Giriş Yap
    </a>
</div>

<style>
.edit-profile-container {
  background-color: rgba(0,0,0,0.8);
  padding: 4em;
  margin: 2em auto;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  width: 100%;
  max-width: 500px;
  text-align: center;
}
.edit-profile-container h2 {
  font-size: 2em; color: rgb(135,0,0); margin-bottom: 1em; font-weight: bold;
}
.save-button {
  background-color: #910000; color: #fff; border: none;
  border-radius: 5px; padding: 0.8em 1.5em; font-size: 1.2em;
  font-weight: bold; text-transform: uppercase; cursor: pointer;
  transition: background-color 0.3s ease;
}
.save-button:hover { background-color: #b30000; }
</style>
{% endblock %}
